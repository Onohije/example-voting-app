name: CI

on:
  push:
    branches: [ main ]
  
    #lets the workflow request the oidc and read its contents
permissions:
  contents: read
  id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service: [vote, result, worker] # run the same job multiple times, once for each service in the list

        steps:
            - name: Checkout code from repository
              uses: actions/checkout@v4
            - uses: actions/checkout@v4
            - name: Debug OIDC claims (temporary)
              run: |
                TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
                python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print({k:c.get(k) for k in ['sub','aud','ref','repository']})" "$TOKEN"
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}
            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v2 

        