name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the app
        run: docker compose up -d --build --wait

      - name: Run end-to-end test
        run: bash tests/e2e.sh

      - name: Stop the app
        if: always()
        run: docker compose down -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/voting-app-${{ matrix.service }}:${{ github.sha }}
          docker build -t $IMAGE ./${{ matrix.service }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Smoke test image
        if: matrix.service != 'worker'
        run: |
          docker run -d --name smoke -p 8000:80 $IMAGE
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000 > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          REPO=voting-app-${{ matrix.service }}
          if aws ecr describe-images --repository-name $REPO --image-ids imageTag=${{ github.sha }} > /dev/null 2>&1; then
            echo "Image $REPO:${{ github.sha }} already in ECR, skipping push"
          else
            docker push $IMAGE
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to EKS
        run: helm upgrade --install voting charts/voting-app --set image.tag=${{ github.sha }} --wait --timeout 5m
