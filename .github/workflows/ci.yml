name: CI

on:
  push:
    branches: [ main ]
  
    #lets the workflow request the oidc and read its contents
permissions:
  contents: read
  id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [vote, result, worker] # run the same job multiple times, once for each service in the list

        steps:
            - name: Checkout code from repository
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build image
              env:
                REGISTRY: ${{ steps.ecr.outputs.registry }}
              run: |
                IMAGE=$REGISTRY/voting-app-${{ matrix.service }}:${{ github.sha }}
                docker build -t $IMAGE ./${{ matrix.service }}
                echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ env.IMAGE }}
                severity: CRITICAL,HIGH
                exit-code: '1'
                ignore-unfixed: true

            - name: Push image to ECR
              run: docker push $IMAGE
    
    deploy: 
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code from repository
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Update kubeconfig
              run: |
                aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
            
            - name: Set up Helm
              uses: azure/setup-helm@v4
            - name: Deploy to EKS cluster
              run: |
                    helm upgrade --install voting charts/voting-app --set image.tag=${{ github.sha }} --wait --timeout 5m