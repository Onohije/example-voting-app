name: CI

on:
  push:
    branches: [ main ]
  
    #lets the workflow request the oidc and read its contents
permissions:
  contents: read
  id-token: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code from repository
              uses: actions/checkout@v4
            - name: Start the app
              run: docker compose up -d --build --wait

            - name: Run end-to-end test
              run: bash tests/e2e.sh

            - name: Stop the app
              if: always()
              run: docker compose down -v

    build:
        needs:  test
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [vote, result, worker] # run the same job multiple times, once for each service in the list

        steps:
            - name: Checkout code from repository
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Push image to ECR
              run: |
                TAG=${{ github.sha }}
                REPO=voting-app-${{ matrix.service }}
                if aws ecr describe-images --repository-name $REPO --image-ids imageTag=$TAG > /dev/null 2>&1; then
                  echo "Image $REPO:$TAG already in ECR, skipping push"
                else
                  docker push $IMAGE
                fi
            
            - name: Smoke test image
              if: matrix.service != 'worker'
              run: |
                     docker run -d --name smoke -p 8000:80 $IMAGE
                     for i in $(seq 1 20); do
                     if curl -fsS http://localhost:8000 > /dev/null; then
                     echo "Smoke test passed"
                     exit 0
                     fi
                     sleep 1
                     done
                     docker logs smoke
                     exit 1

            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ env.IMAGE }}
                severity: CRITICAL,HIGH
                exit-code: '1'
                ignore-unfixed: true

            - name: Push image to ECR
              run: docker push $IMAGE
    
    deploy: 
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code from repository
              uses: actions/checkout@v4
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Update kubeconfig
              run: |
                aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
            
            - name: Set up Helm
              uses: azure/setup-helm@v4
            - name: Deploy to EKS cluster
              run: |
                    helm upgrade --install voting charts/voting-app --set image.tag=${{ github.sha }} --wait --timeout 5m